schema_version: 1

context:
  name: meds
  version: "0.9.17"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/esheldon/meds/archive/v${{ version }}.tar.gz
  sha256: 0d8a82d89cfb791d777c5404696fdf48368eb566a54bddc7c36b7dbadb5178e0

build:
  number: 4
  skip: win
  script:
    - if: linux
      then: export CFLAGS="${CFLAGS} -Wno-incompatible-pointer-types"
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: numpy
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - numpy
  run:
    - python
    - fitsio
    - pyyaml
    - esutil

tests:
  - python:
      imports:
        - meds
      pip_check: false

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Python and C libraries to work with Multi Epoch Data Structures
  homepage: https://github.com/esheldon/meds
  repository: https://github.com/esheldon/meds
  documentation: https://github.com/esheldon/meds

extra:
  recipe-maintainers:
    - beckermr
    - esheldon
